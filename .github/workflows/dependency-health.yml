name: Dependency availability
on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Read the exact triggering commit
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          git init .
          git fetch --depth=1 "https://github.com/${SOURCE_REPOSITORY}.git" "$SOURCE_COMMIT"
          git checkout --detach FETCH_HEAD
      - name: Check fetch trust boundaries offline
        run: python3 tools/test-deps.py
      - name: Check pinned copies and upstream availability
        run: python3 tools/check-deps.py
