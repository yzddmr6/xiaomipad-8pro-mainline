#
# Xiaomi Pad 8 Pro (piano): internal digital microphones on the LPASS VA macro,
# VA_CODEC_DMA_TX_0 -> MultiMedia3 (hw:N,2), 48 kHz S16_LE, two channels.
# Structure from blu-sharky/debian-piano a75f8c5d5fa0 (MIT) and the alsa-ucm-conf
# VA DMIC sequences (BSD-3-Clause, d260eedd1900); the DMIC lines,
# decimators and channel count follow piano's stock mixer, not those files.
# No playback: the speaker amplifiers are not enabled.

SectionVerb {
	# The front end to back end route belongs to the verb: the PCM does not
	# open without it, and PipeWire opens every PCM while it probes the verb,
	# before any device is enabled (debian-piano).
	EnableSequence [
		cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 1"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphones"

	# Stock ODM va-mic-dmic path: VA DEC0 <- DMIC0 (side-top microphone,
	# LPI GPIO6/7) and VA DEC1 <- DMIC2 (side-bottom, GPIO8/9); the stock
	# handset recording pairs the same two DMICs. AudioReach's contiguous DMA
	# mask puts DEC0/DEC1 on PCM channels 0/1. Gain 100 (+16 dB, 1 dB steps
	# from 84 = 0 dB) is the upstream VA DMIC default; the stock 84 is
	# followed by DSP processing that this graph does not have. The stock
	# ADC_LOW_PWR mode belongs to its voice-activation use and is not set.
	EnableSequence [
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DMIC MUX0' DMIC0"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_DEC0 Volume' 100"
		cset "name='VA DEC1 MUX' VA_DMIC"
		cset "name='VA DMIC MUX1' DMIC2"
		cset "name='VA_AIF1_CAP Mixer DEC1' 1"
		cset "name='VA_DEC1 Volume' 100"
	]

	DisableSequence [
		cset "name='VA DMIC MUX0' ZERO"
		cset "name='VA_DEC0 Volume' 0"
		cset "name='VA_AIF1_CAP Mixer DEC0' 0"
		cset "name='VA DMIC MUX1' ZERO"
		cset "name='VA_DEC1 Volume' 0"
		cset "name='VA_AIF1_CAP Mixer DEC1' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
	}
}
