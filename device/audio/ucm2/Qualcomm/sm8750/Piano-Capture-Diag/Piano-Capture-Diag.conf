#
# Xiaomi Pad 8 Pro (piano): card "Piano-Capture-Diag" (driver sm8750), internal
# microphones only. Layout of alsa-ucm-conf Qualcomm/sm8750/MTP/SM8750-MTP.conf
# Kept for kernels up to 7.2.6-piano5, whose desktop DTB names the card
# Piano-Capture-Diag (capture only); from piano6 the card is Xiaomi-Pad-8-Pro.
# and of blu-sharky/debian-piano a75f8c5d5fa0 Xiaomi-Pad-8-Pro.conf.

Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8750/Piano-Capture-Diag/HiFi.conf"
	Comment "HiFi quality Music."
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
