#
# Xiaomi Pad 8 Pro (piano): the four speakers on the secondary TDM interface,
# MultiMedia1 (hw:N,0) -> SECONDARY_TDM_RX_0, and the internal digital
# microphones on the LPASS VA macro, VA_CODEC_DMA_TX_0 -> MultiMedia3 (hw:N,2),
# 48 kHz S16_LE. Structure from blu-sharky/debian-piano a75f8c5d5fa0 (MIT) and
# the alsa-ucm-conf VA DMIC sequences (BSD-3-Clause, d260eedd1900); the DMIC
# lines, decimators, channel counts and amplifier gain follow piano's stock
# mixer and this project's limits, not those files.

SectionVerb {
	# The front end to back end routes belong to the verb: the PCMs do not
	# open without them, and PipeWire opens every PCM while it probes the
	# verb, before any device is enabled (debian-piano).
	EnableSequence [
		cset "name='SECONDARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 1"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	# Four FS19xx amplifiers, one per TDM slot (the vendor preset assigns
	# them): channel 0 top left, 1 top right, 2 bottom left, 3 bottom right,
	# in landscape with the front camera on top. A stereo stream reaches the
	# top pair only unless the sound server up-mixes. There is no speaker
	# protection. Gain 231 of 255 (0.375 dB steps, -9 dB) is a chosen
	# default, not a proven safety limit. It requires
	# the matching kernel cap of 231. No hardware volume element is exposed:
	# the four mono controls apply only at the next stream start. The playback
	# graph has no DSP gain; software volume at 100% is digital unity.
	# Stock Android uses 243 (four speakers) / 235 (one) with protection.
	EnableSequence [
		cset "name='Top Left Amp Volume' 231"
		cset "name='Top Right Amp Volume' 231"
		cset "name='Bottom Left Amp Volume' 231"
		cset "name='Bottom Right Amp Volume' 231"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 4
	}
}

SectionDevice."Mic" {
	Comment "Internal microphones"

	# Stock ODM va-mic-dmic path: VA DEC0 <- DMIC0 (side-top microphone,
	# LPI GPIO6/7) and VA DEC1 <- DMIC2 (side-bottom, GPIO8/9); the stock
	# handset recording pairs the same two DMICs. AudioReach's contiguous DMA
	# mask puts DEC0/DEC1 on PCM channels 0/1. Gain 124 (+40 dB, 1 dB steps
	# from 84 = 0 dB, the control maximum): the stock 84 is followed by DSP
	# processing that this graph does not have, and the upstream default of
	# +16 dB records the internal speaker's -10.5 dBFS tone at only -48/-55
	# dBFS. Project SunUEFI settled on +40 dB for the same microphones by
	# listening tests (a26a2df). The stock ADC_LOW_PWR mode belongs to its
	# voice-activation use and is not set.
	EnableSequence [
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DMIC MUX0' DMIC0"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_DEC0 Volume' 124"
		cset "name='VA DEC1 MUX' VA_DMIC"
		cset "name='VA DMIC MUX1' DMIC2"
		cset "name='VA_AIF1_CAP Mixer DEC1' 1"
		cset "name='VA_DEC1 Volume' 124"
	]

	DisableSequence [
		cset "name='VA DMIC MUX0' ZERO"
		cset "name='VA_DEC0 Volume' 0"
		cset "name='VA_AIF1_CAP Mixer DEC0' 0"
		cset "name='VA DMIC MUX1' ZERO"
		cset "name='VA_DEC1 Volume' 0"
		cset "name='VA_AIF1_CAP Mixer DEC1' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
	}
}
