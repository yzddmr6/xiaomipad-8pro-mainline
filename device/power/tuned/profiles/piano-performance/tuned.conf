[main]
summary=Piano performance CPU and GPU policy

# Explicit sysfs settings avoid inheriting unrelated disk/network tunings.
# CPU values are kHz; GPU values are Hz. Keep schedutil for idle scaling.
# Responsiveness first: the whole hardware range as in balanced, but a busy
# core never runs below 2918400 kHz (the six smaller cores) or 2841600 kHz
# (the two prime cores), so short bursts (opening an app, a scroll, the thread
# that feeds the GPU) start fast instead of waiting for the governor to ramp
# up. Idle cores still sleep. Maxima come first so the floors always fit.
[sysfs]
/sys/devices/system/cpu/cpufreq/boost=1
/sys/devices/system/cpu/cpufreq/policy0/scaling_governor=schedutil
/sys/devices/system/cpu/cpufreq/policy6/scaling_governor=schedutil
/sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq=3532800
/sys/devices/system/cpu/cpufreq/policy6/scaling_max_freq=4320000
/sys/devices/system/cpu/cpufreq/policy0/scaling_min_freq=2918400
/sys/devices/system/cpu/cpufreq/policy6/scaling_min_freq=2841600
/sys/class/devfreq/3d00000.gpu/min_freq=160000000
/sys/class/devfreq/3d00000.gpu/max_freq=1100000000
