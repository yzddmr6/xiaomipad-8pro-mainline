# A distro initrd with explicit rootfs from fstab/boot command line. Do not
# infer a loop, overlay or build-host device while constructing an image.
hostonly="no"
hostonly_cmdline="no"
add_dracutmodules+=" piano "
filesystems+=" ext4 "
# Fit the complete firmware and module set in the 96 MiB RAM boot image.
compress="zstd"
compress_level_zstd=19
