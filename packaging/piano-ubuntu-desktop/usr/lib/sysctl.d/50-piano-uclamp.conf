# Real-time threads (audio, the compositor's KMS thread) get no utilization
# floor by default, in every power mode, as on stock Android (its post_boot
# script writes 0). The kernel's default of 1024 asks for the highest
# frequency whenever one of them runs and lets them run only on the two prime
# cores. The leading '-' ignores kernels built without CONFIG_UCLAMP_TASK.
-kernel.sched_util_clamp_min_rt_default = 0
